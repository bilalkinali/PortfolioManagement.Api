<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      const savedTheme = window.localStorage.getItem('theme')
      const initialTheme = savedTheme === 'light' ? 'light' : 'dark'

      document.documentElement.classList.toggle('dark', initialTheme === 'dark')
      document.documentElement.style.colorScheme = initialTheme
    </script>
    <style>
      html.dark {
        color-scheme: dark;
        background: oklch(0.145 0.012 255);
        color: oklch(0.94 0.012 245);
        --background: oklch(0.145 0.012 255);
        --foreground: oklch(0.94 0.012 245);
        --card: oklch(0.195 0.015 255);
        --card-foreground: oklch(0.94 0.012 245);
        --popover: oklch(0.205 0.016 255);
        --popover-foreground: oklch(0.94 0.012 245);
        --primary: oklch(0.66 0.12 70);
        --primary-foreground: oklch(0.16 0.014 255);
        --secondary: oklch(0.265 0.018 255);
        --secondary-foreground: oklch(0.91 0.012 245);
        --muted: oklch(0.245 0.016 255);
        --muted-foreground: oklch(0.73 0.016 245);
        --accent: oklch(0.31 0.035 75);
        --accent-foreground: oklch(0.95 0.012 245);
        --border: oklch(1 0.012 245 / 7%);
        --input: oklch(0.31 0.018 255);
        --ring: oklch(0.66 0.035 245);
        --sidebar-primary: oklch(0.66 0.12 70);
        --sidebar-ring: oklch(0.66 0.035 245);
      }

      body {
        margin: 0;
        background: var(--background, oklch(1 0 0));
        color: var(--foreground, oklch(0.145 0 0));
      }

      #root {
        min-height: 100vh;
      }

      body:not(.app-ready) #root {
        visibility: hidden;
      }
    </style>
    <title>portfoliomanagement.web</title>
  </head>
  <body>
  <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
